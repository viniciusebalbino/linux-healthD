<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · healthD</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23070a0e'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%239dff6a'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/app.css?v=20">
</head>
<body class="login-body">
  <div class="noise" aria-hidden="true"></div>
  <form class="login-card" id="loginForm">
    <div class="brand">
      <span class="brand__mark" aria-hidden="true"></span>
      <div>
        <strong>healthD</strong>
        <small>login na máquina</small>
      </div>
    </div>
    <p>Use um usuário local deste Linux que esteja no grupo <code>healthd</code>.</p>
    <label>
      Usuário
      <input id="loginUser" name="username" autocomplete="username" required spellcheck="false">
    </label>
    <label>
      Senha
      <input id="loginPass" name="password" type="password" autocomplete="current-password" required>
    </label>
    <p class="modal__hint" id="loginHint"></p>
    <button type="submit" class="btn-ai">Entrar</button>
  </form>
  <script>
    fetch("/api/session", { credentials: "same-origin" })
      .then((r) => r.json())
      .then((d) => { if (!d.required || d.user) window.location.replace("/"); })
      .catch(() => {});
    document.getElementById("loginForm").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const hint = document.getElementById("loginHint");
      hint.textContent = "Verificando…";
      try {
        const res = await fetch("/api/login", {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: document.getElementById("loginUser").value,
            password: document.getElementById("loginPass").value,
          }),
        });
        const data = await res.json();
        if (!res.ok) {
          hint.textContent = data.message || "Não foi possível entrar.";
          return;
        }
        window.location.replace("/");
      } catch (err) {
        hint.textContent = err.message;
      }
    });
  </script>
</body>
</html>
